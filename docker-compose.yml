version: '3.8'

services:
  opentripplanner:
    build:
      context: .
      args:
        - INTERLINE_API_TOKEN=${INTERLINE_API_TOKEN}
    container_name: otp-detroit
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - JAVA_OPTS=-Xmx4G
    env_file:
      - .env
    restart: unless-stopped
